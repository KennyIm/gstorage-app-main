{% extends 'inventario/base.html' %}
{% block title %}Formulario de Camión{% endblock %}

{% block content %}
    {% if object %}
        <h1>Editar Camión</h1>
    {% else %}
        <h1>Registrar Nuevo Camión</h1>
    {% endif %}
    <hr>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'camion-list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
