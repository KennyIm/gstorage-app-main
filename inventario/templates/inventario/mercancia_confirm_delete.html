{% extends 'inventario/base.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
    <h1>Confirmar Eliminación</h1>
    <hr>
    
    <div class="alert alert-danger">
        <h4>¿Estás seguro?</h4>
        <p>Estás a punto de eliminar permanentemente la mercancía <strong>"{{ object }}"</strong>.</p>
        <p>Esta acción no se puede deshacer.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
        <a href="{% url 'mercancia-detail' object.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
